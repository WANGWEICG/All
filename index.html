<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端簡易庫存管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div id="app" class="max-w-md mx-auto min-h-screen pb-20">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
            <h1 class="text-xl font-bold flex justify-between items-center">
                📦 庫存管理系統
                <span class="text-xs bg-blue-800 px-2 py-1 rounded">繁體中文版</span>
            </h1>
        </header>

        <!-- 頁籤切換 -->
        <div class="flex bg-white border-b sticky top-[60px] z-10">
            <button @click="tab = 'list'" :class="tab === 'list' ? 'border-blue-500 text-blue-600' : 'text-gray-500'" class="flex-1 py-3 text-center border-b-2 font-medium">庫存清單</button>
            <button @click="tab = 'add'" :class="tab === 'add' ? 'border-blue-500 text-blue-600' : 'text-gray-500'" class="flex-1 py-3 text-center border-b-2 font-medium">新增商品</button>
            <button @click="tab = 'history'" :class="tab === 'history' ? 'border-blue-500 text-blue-600' : 'text-gray-500'" class="flex-1 py-3 text-center border-b-2 font-medium">異動紀錄</button>
        </div>

        <!-- 內容區 -->
        <main class="p-4">
            
            <!-- 搜尋框 -->
            <div v-if="tab === 'list'" class="mb-4">
                <input v-model="searchQuery" type="text" placeholder="搜尋商品名稱或編號..." class="w-full p-3 rounded-lg border shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- 1. 庫存清單 -->
            <div v-if="tab === 'list'" class="space-y-3">
                <div v-for="item in filteredProducts" :key="item.id" class="bg-white p-4 rounded-xl shadow-sm border-l-4" :class="item.stock <= item.minStock ? 'border-red-500' : 'border-green-500'">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-lg text-gray-800">{{ item.name }}</h3>
                            <p class="text-sm text-gray-500">編號: {{ item.id }} | 分類: {{ item.category }}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold" :class="item.stock <= item.minStock ? 'text-red-600' : 'text-blue-600'">{{ item.stock }}</p>
                            <p class="text-xs text-gray-400">安全水位: {{ item.minStock }}</p>
                        </div>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <button @click="adjustStock(item, -1)" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2 rounded-lg font-bold text-gray-700">- 1 出庫</button>
                        <button @click="adjustStock(item, 1)" class="flex-1 bg-blue-50 hover:bg-blue-100 py-2 rounded-lg font-bold text-blue-600">+ 1 入庫</button>
                        <button @click="deleteProduct(item)" class="px-3 text-gray-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div v-if="filteredProducts.length === 0" class="text-center py-10 text-gray-400">找不到相關商品</div>
            </div>

            <!-- 2. 新增商品 -->
            <div v-if="tab === 'add'" class="bg-white p-6 rounded-xl shadow-sm space-y-4">
                <h2 class="text-lg font-bold mb-2">建立新商品檔</h2>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">商品名稱</label>
                    <input v-model="newProduct.name" type="text" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">商品編號 / 條碼</label>
                    <input v-model="newProduct.id" type="text" class="w-full p-2 border rounded" placeholder="可掃描或輸入">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">初始庫存</label>
                        <input v-model.number="newProduct.stock" type="number" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">安全水位</label>
                        <input v-model.number="newProduct.minStock" type="number" class="w-full p-2 border rounded">
                    </div>
                </div>
                <button @click="addProduct" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold mt-4 hover:bg-blue-700">確認新增</button>
            </div>

            <!-- 3. 異動紀錄 -->
            <div v-if="tab === 'history'" class="space-y-2">
                <div v-for="log in history" class="bg-white p-3 rounded shadow-sm text-sm flex justify-between">
                    <div>
                        <span :class="log.type === '入庫' ? 'text-green-600' : 'text-red-600'" class="font-bold">[{{ log.type }}]</span>
                        <span class="ml-2 font-medium">{{ log.name }}</span>
                    </div>
                    <div class="text-gray-400 text-xs text-right">
                        {{ log.qty > 0 ? '+' : '' }}{{ log.qty }} <br> {{ log.time }}
                    </div>
                </div>
                <div v-if="history.length === 0" class="text-center py-10 text-gray-400">尚無異動紀錄</div>
            </div>

        </main>

        <!-- 手機底部快速選單 -->
        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around p-2 text-xs text-gray-500 shadow-lg">
            <div class="text-center p-2" @click="tab = 'list'">
                <i class="fas fa-boxes text-xl mb-1" :class="tab === 'list' ? 'text-blue-600' : ''"></i>
                <p :class="tab === 'list' ? 'text-blue-600 font-bold' : ''">清單</p>
            </div>
            <div class="text-center p-2" @click="tab = 'add'">
                <i class="fas fa-plus-circle text-xl mb-1" :class="tab === 'add' ? 'text-blue-600' : ''"></i>
                <p :class="tab === 'add' ? 'text-blue-600 font-bold' : ''">新增</p>
            </div>
            <div class="text-center p-2" @click="tab = 'history'">
                <i class="fas fa-history text-xl mb-1" :class="tab === 'history' ? 'text-blue-600' : ''"></i>
                <p :class="tab === 'history' ? 'text-blue-600 font-bold' : ''">紀錄</p>
            </div>
        </nav>
    </div>

    <script>
        const { createApp, ref, computed, watch, onMounted } = Vue;

        createApp({
            setup() {
                const tab = ref('list');
                const searchQuery = ref('');
                const products = ref([]);
                const history = ref([]);
                const newProduct = ref({ id: '', name: '', stock: 0, minStock: 5, category: '預設' });

                // 從本地儲存載入資料
                onMounted(() => {
                    const savedProducts = localStorage.getItem('inv_products');
                    const savedHistory = localStorage.getItem('inv_history');
                    if (savedProducts) products.value = JSON.parse(savedProducts);
                    if (savedHistory) history.value = JSON.parse(savedHistory);
                });

                // 監聽並自動儲存
                watch([products, history], () => {
                    localStorage.setItem('inv_products', JSON.stringify(products.value));
                    localStorage.setItem('inv_history', JSON.stringify(history.value));
                }, { deep: true });

                const filteredProducts = computed(() => {
                    return products.value.filter(p => 
                        p.name.includes(searchQuery.value) || p.id.includes(searchQuery.value)
                    );
                });

                const addProduct = () => {
                    if (!newProduct.value.name || !newProduct.value.id) return alert('請填寫完整資訊');
                    products.value.push({ ...newProduct.value });
                    newProduct.value = { id: '', name: '', stock: 0, minStock: 5, category: '預設' };
                    tab.value = 'list';
                };

                const adjustStock = (item, val) => {
                    item.stock += val;
                    history.value.unshift({
                        type: val > 0 ? '入庫' : '出庫',
                        name: item.name,
                        qty: val,
                        time: new Date().toLocaleString()
                    });
                    // 只保留最近 50 筆紀錄
                    if (history.value.length > 50) history.value.pop();
                };

                const deleteProduct = (item) => {
                    if (confirm(`確定要刪除 ${item.name} 嗎？`)) {
                        products.value = products.value.filter(p => p.id !== item.id);
                    }
                };

                return { tab, searchQuery, products, filteredProducts, newProduct, addProduct, adjustStock, history, deleteProduct };
            }
        }).mount('#app');
    </script>
</body>
</html>
